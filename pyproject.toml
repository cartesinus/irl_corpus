[project]
name = "irl-corpus"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "google-genai",
    "sqlalchemy>=2.0",
    "alembic",
    "fsspec",
    "s3fs",
    "typer[all]",
    "rich",
]

[project.optional-dependencies]
vad = ["silero-vad"]
vis = ["matplotlib"]
all = ["silero-vad", "matplotlib"]

[project.scripts]
irl = "irl_corpus.cli.main:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["irl_cli"]
